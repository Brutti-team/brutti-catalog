<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 68 250 164" role="img" aria-label="Brutti official wordmark">
  <!-- Exact original Brutti wordmark from brutti.my, with its dark photo background keyed out. -->
  <defs>
    <filter id="ink" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.31  0 0 0 0 0.23  1 1 1 0 -1.4"/>
    </filter>
  </defs>
  <image x="0" y="0" width="300" height="300" href="data:image/jpeg;base64," filter="url(#ink)"/>
</svg>