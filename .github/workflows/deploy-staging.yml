name: Deploy approved Brutti Catalog staging

on:
  push:
    branches:
      - feat/catalog-phase-one
    paths:
      - .github/workflows/deploy-staging.yml

# Staging uses only the separate brutti-catalog GitHub Pages site.
# Approved staging refresh: compact sidebar, My Profile only in header,
# server-sourced Last Change card with Malaysia timestamp and preserved dark mode.
# Role/audit SQL proposals remain UNAPPLIED; no production database writes.
# Keep path-filtered activation to avoid deploying every subsequent PR edit.
# Never merge PR #1, write to Supabase production data or touch brutti.my.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brutti-catalog-pages-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.repository == 'Brutti-team/brutti-catalog' && github.ref == 'refs/heads/feat/catalog-phase-one'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout the approved staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify real read-only Supabase connectivity and build
        run: npm run build:configured
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload the catalog staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish staging only
        id: deployment
        uses: actions/deploy-pages@v4
