name: Deploy approved Brutti Catalog staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deploys the approved, reviewed main branch to the separate project Pages URL:
# https://brutti-team.github.io/brutti-catalog/
# This keeps the user's established Catalog Admin link in sync with main.
# Pure website integration remains in the separate benua-brutti-website workflow.
# No production database writes or secret-role keys are used here.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brutti-catalog-pages-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.repository == 'Brutti-team/brutti-catalog' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout approved Catalog main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify real read-only Supabase connectivity and build
        run: npm run build:configured
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload the catalog staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish staging only
        id: deployment
        uses: actions/deploy-pages@v4
