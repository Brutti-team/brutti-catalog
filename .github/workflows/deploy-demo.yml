name: Deploy Brutti Catalog Demo

on:
  push:
    branches:
      - feat/catalog-phase-one
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "brutti-catalog-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: brutti-catalog-demo
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build safe demo for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_DEMO_MODE: "true"
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: npm run build

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
