name: Validate Brutti Catalog production code

on:
  push:
    branches:
      - feat/catalog-phase-one
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests (intercepted backend only)
        run: npm run test:e2e

      - name: Local schema and policy tests (no production connection)
        run: npm run test:db

      - name: Set up Python for PDF evidence helpers
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test PDF evidence extraction (synthetic fixtures only)
        run: |
          python -m pip install -r scripts/pdf-requirements.txt
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build production bundle
        env:
          GITHUB_PAGES: "true"
          # Build-only placeholders. These values must never be used for a public deployment.
          VITE_SUPABASE_URL: "https://brutti-catalog-check.invalid"
          VITE_SUPABASE_ANON_KEY: "not-a-real-key"
        run: npm run build

# Deployment deliberately disabled until the existing Brutti Supabase project,
# verified staff permissions, import and public routing are approved.
