name: Validate Brutti Catalog production code

on:
  push:
    branches:
      - feat/catalog-phase-one
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        env:
          GITHUB_PAGES: "true"
          # Build-only placeholders. These values must never be used for a public deployment.
          VITE_SUPABASE_URL: "https://brutti-catalog-check.invalid"
          VITE_SUPABASE_ANON_KEY: "not-a-real-key"
        run: npm run build

# Deployment deliberately disabled until dedicated Brutti Supabase project,
# verified staff permissions, import and public routing are approved.
